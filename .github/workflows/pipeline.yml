name: Build, Download & Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'esp_loader/package-lock.json'

      - name: Install Dependencies
        working-directory: ./esp_loader
        run: npm ci

      - name: Build Application
        working-directory: ./esp_loader
        run: npm run build

      - name: Upload Downloadable Web Build
        uses: actions/upload-artifact@v4
        with:
          name: unit-microsupport-labs-web-${{ github.run_number }}
          path: esp_loader/dist/
          retention-days: 30
          if-no-files-found: error

      - name: Add Download Instructions
        run: |
          {
            echo "### Descarga del compilado"
            echo ""
            echo "Descarga **unit-microsupport-labs-web-${{ github.run_number }}** desde la sección **Artifacts** de esta ejecución."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy to docs Directory
        run: |
          rm -rf docs/*
          mkdir -p docs
          cp -r esp_loader/dist/* docs/
          touch docs/.nojekyll
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git add docs/
          if ! git diff --staged --quiet; then
            git commit -m "chore: auto-update docs build artifacts [skip ci]"
            git push origin main
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
